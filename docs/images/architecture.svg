<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">AffinityQA recorded replay architecture</title><desc id="desc">Source code and separately authorized private evidence join a restricted replay service. It checks receipt hashes, executes detect diagnose repair verify, and shows results in the reviewer interface. No fresh model or Qloo calls are made during replay.</desc>
<rect width="1200" height="600" rx="24" fill="#151c29"/>
<text x="56" y="64" fill="#f6f2e8" font-family="Arial,sans-serif" font-size="31" letter-spacing="-1">The recovery path, made inspectable.</text><text x="57" y="99" fill="#b9c49b" font-family="Arial,sans-serif" font-size="14" letter-spacing="2">ARCHITECTURE · RECORDED REPLAY</text>
<g font-family="Arial,sans-serif"><rect x="56" y="146" width="295" height="130" rx="16" fill="#f6f2e8"/><text x="78" y="185" fill="#242d23" font-size="21" font-weight="700">Public source</text><text x="78" y="218" fill="#525b4a" font-size="16">Operators · interface · tests</text><text x="78" y="243" fill="#525b4a" font-size="16">Code and dependency locks</text>
<rect x="56" y="302" width="295" height="140" rx="16" fill="#252e3e" stroke="#ddb8ac"/><text x="78" y="342" fill="#f6f2e8" font-size="21" font-weight="700">Private evidence</text><text x="78" y="375" fill="#e3c7bd" font-size="16">Authorized recorded decisions</text><text x="78" y="401" fill="#e3c7bd" font-size="16">Receipts · bound source hashes</text>
<path d="M352 211H392V282H430M352 372H392V302H430" fill="none" stroke="#b9c49b" stroke-width="2"/><path d="m421 273 10 9-10 9m0 2 10 9-10 9" fill="none" stroke="#b9c49b" stroke-width="2"/>
<rect x="440" y="146" width="316" height="296" rx="16" fill="#dce4ca"/><text x="464" y="185" fill="#242d23" font-size="21" font-weight="700">Restricted replay service</text><text x="464" y="221" fill="#3c4931" font-size="16">1. Verify evidence bindings</text><text x="464" y="257" fill="#3c4931" font-size="16">2. Diagnose observed mismatch</text><text x="464" y="293" fill="#3c4931" font-size="16">3. Apply supported repair</text><text x="464" y="329" fill="#3c4931" font-size="16">4. Redispatch and check recovery</text><path d="M464 355H731" stroke="#798666"/><text x="464" y="386" fill="#3c4931" font-size="14">Recorded decisions, executed pipeline</text><text x="464" y="412" fill="#3c4931" font-size="14">No fresh model or provider calls</text>
<path d="M757 292H828m-10-9 10 9-10 9" fill="none" stroke="#b9c49b" stroke-width="2"/>
<rect x="840" y="202" width="303" height="183" rx="16" fill="#f6f2e8"/><text x="862" y="242" fill="#242d23" font-size="21" font-weight="700">Reviewer interface</text><text x="862" y="279" fill="#525b4a" font-size="16">Before · after · healthy reference</text><text x="862" y="308" fill="#525b4a" font-size="16">Diagnosis · trace · six checks</text><text x="862" y="346" fill="#525b4a" font-size="14">No raw evidence export</text>
<path d="M56 488H1144" stroke="#f6f2e8" stroke-opacity=".18"/><text x="57" y="527" fill="#f6f2e8" font-size="16">Causal recovery is tested separately from cultural recommendation quality.</text><text x="57" y="557" fill="#b9c49b" font-size="14">No evidence installed → UNAVAILABLE. The source preview never fabricates a result.</text></g>
