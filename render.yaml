{
  "services": [
    {
      "type": "web",
      "name": "affinityqa-review",
      "runtime": "python",
      "plan": "starter",
      "region": "frankfurt",
      "autoDeployTrigger": "off",
      "buildCommand": "AFFINITYQA_NODE_EXECUTABLE=\"$(node -p process.execPath | tail -n 1)\" && test -x \"$AFFINITYQA_NODE_EXECUTABLE\" && PATH=\"$(dirname \"$AFFINITYQA_NODE_EXECUTABLE\"):$PATH\" python deployment/build_render.py",
      "startCommand": "python deployment/start_render.py",
      "healthCheckPath": "/healthz",
      "maintenanceMode": {
        "enabled": true
      },
      "disk": {
        "name": "affinityqa-evidence",
        "mountPath": "/var/data",
        "sizeGB": 1
      },
      "envVars": [
        {
          "key": "PYTHON_VERSION",
          "value": "3.12.14"
        },
        {
          "key": "NODE_VERSION",
          "value": "24.19.0"
        },
        {
          "key": "PYTHONDONTWRITEBYTECODE",
          "value": "1"
        },
        {
          "key": "AFFINITYQA_RUN_ID",
          "sync": false
        },
        {
          "key": "AFFINITYQA_RECEIPT_SHA256",
          "sync": false
        }
      ]
    }
  ]
}
