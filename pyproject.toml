[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "affinityqa"
version = "0.2.0"
description = "Mutation testing for personalized AI agents — local backend and Qloo feasibility harness"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
backend = ["fastapi==0.142.2", "uvicorn==0.54.0"]
test = ["httpx2==2.13.1"]

[project.scripts]
affinityqa = "affinityqa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

