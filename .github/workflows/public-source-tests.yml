name: Public source engineering checks
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared Python dependencies
        run: python -m pip install -r requirements-backend.lock.txt
      - name: Synthetic tests only
        run: |
          $PublicTests = @('test_causal_agent.py','test_causal_runner.py','test_causal_evaluator.py','test_keyword_calibrator.py','test_keyword_words.py','test_pairwise_rank_calibrator.py','test_broad_movie_context.py','test_taste_tags.py','test_public_source_package.py','test_public_demo.py','test_public_demo_verifier.py')
          foreach ($TestName in $PublicTests) {
            if (Test-Path (Join-Path 'tests' $TestName)) {
              python -m unittest discover -s tests -p $TestName -v
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
      - name: Check source allowlist
        run: python scripts/build_public_source.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - name: Install locked web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck and build source
        working-directory: web
        run: |
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build
