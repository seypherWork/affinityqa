name: Public source engineering checks
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-only:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install declared Python dependencies
        run: python -m pip install -r requirements-backend.lock.txt
      - name: Synthetic tests only
        run: |
          python -B -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check source allowlist
        run: python scripts/build_public_source.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install locked web dependencies
        working-directory: web
        run: npx --yes pnpm@11.25.0 install --frozen-lockfile --ignore-scripts
      - name: Typecheck and build source
        working-directory: web
        run: |
          npx --yes pnpm@11.25.0 typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx --yes pnpm@11.25.0 build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
