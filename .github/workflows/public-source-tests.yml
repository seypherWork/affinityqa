name: Public source engineering checks
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-only:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.13.16'
          - os: ubuntu-24.04
            python: '3.12.14'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install declared Python dependencies
        run: |
          python -m pip install -r requirements-backend.lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --require-hashes -r requirements-repeatable.lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
      - name: Synthetic tests only
        run: |
          python -B -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check source allowlist
        run: python scripts/build_public_source.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install locked web dependencies
        working-directory: web
        run: npx --yes pnpm@11.25.0 install --frozen-lockfile --ignore-scripts
      - name: Typecheck and build source
        working-directory: web
        run: |
          npx --yes pnpm@11.25.0 typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx --yes pnpm@11.25.0 build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install browser for synthetic UI regressions
        if: runner.os == 'Linux'
        working-directory: web
        run: npx --yes pnpm@11.25.0 exec playwright install --with-deps chromium
      - name: Check interrupted progress recovery on desktop and mobile
        if: runner.os == 'Linux'
        working-directory: web
        run: npx --yes pnpm@11.25.0 test:recovery
      - name: Check complete synthetic browser case and session restoration
        if: runner.os == 'Linux'
        working-directory: web
        run: npx --yes pnpm@11.25.0 test:case-journey
      - name: Check repeatable queue, quota wait and historical recovery
        if: runner.os == 'Linux'
        working-directory: web
        run: npx --yes pnpm@11.25.0 test:repeatable-journey
      - name: Check repeatable frontend with real synthetic backend and owned storage
        if: runner.os == 'Linux'
        working-directory: web
        run: npx --yes pnpm@11.25.0 test:repeatable-backend
      - name: Check confirmed movie input on desktop and mobile
        if: runner.os == 'Linux'
        working-directory: web
        run: |
          npx --yes pnpm@11.25.0 test:movie-input-journey
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx --yes pnpm@11.25.0 test:movie-input-journey -- --mobile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check shared-call capability, empty inputs, film confirmation and preserved cases
        if: runner.os == 'Linux'
        working-directory: web
        run: |
          node ../tests/browser/free-movie-input-journey.cjs --paired
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ../tests/browser/free-movie-input-journey.cjs --paired --mobile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check shared-call browser with actual backend and synthetic providers
        if: runner.os == 'Linux'
        working-directory: web
        run: node ../tests/browser/repeatable-backend-journey.cjs --paired
      - name: Check open-film discovery, native download and response-loss recovery on desktop and mobile
        if: runner.os == 'Linux'
        working-directory: web
        run: |
          node ../tests/browser/open-movie-backend-journey.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ../tests/browser/open-movie-backend-journey.cjs --mobile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check wide film discovery, bound posters and restored history on desktop and mobile
        if: runner.os == 'Linux'
        working-directory: web
        run: |
          node ../tests/browser/wide-cinema-journey.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ../tests/browser/wide-cinema-journey.cjs --mobile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
